name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python

      - name: Get version
        id: version
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$RELEASE_TAG" = "v$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages pyinstaller https://github.com/yeager/libvisio-ng/releases/download/v0.7.2/libvisio_ng-0.7.2-py3-none-any.whl
          runtime_args=()
          for dll in /ucrt64/bin/*.dll; do
            # Use an absolute Windows path. Passing an MSYS2 path directly to
            # a native PyInstaller executable rewrites /ucrt64 as D:/ucrt64
            # instead of the runner's actual MSYS2 installation directory.
            [[ -f "$dll" ]] && runtime_args+=(--add-binary "$(cygpath -w "$dll");.")
          done
          python -m PyInstaller "${runtime_args[@]}" \
            --name VSDView \
            --windowed \
            --onedir \
            --add-data "vsdview;vsdview" \
            --add-data "po;po" \
            --add-data "data;data" \
            --add-data "$(cygpath -w /ucrt64/lib/girepository-1.0);lib/girepository-1.0" \
            --add-data "$(cygpath -w /ucrt64/share/glib-2.0/schemas);share/glib-2.0/schemas" \
            --hidden-import gi \
            --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.Adw \
            --collect-all gi \
            vsdview/__main__.py

      - name: Create ZIP
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd dist
          7z a "../VSDView-${VER}-win64.zip" VSDView/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh release upload "v${VER}" "VSDView-${VER}-win64.zip" --clobber
