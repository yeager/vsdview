name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-rsvg-2.0
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest libvisio-ng
      - run: .venv/bin/python -m pytest tests -q
