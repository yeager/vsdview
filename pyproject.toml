[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsdview"
version = "0.6.3"
description = "A read-only viewer for Microsoft Visio files (.vsdx/.vsd)"
license = "GPL-3.0-or-later"
authors = [
    {name = "Daniel Nylander"}
]
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "libvisio-ng>=0.7.2",
]

[project.scripts]
vsdview = "vsdview.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vsdview*"]
